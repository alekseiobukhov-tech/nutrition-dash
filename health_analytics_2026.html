const CACHE_DAYS = 30, CK = "dash_key_v1";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(password){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password),
    "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(DATA.salt), iterations:DATA.iters, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function tryDecrypt(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(DATA.iv)}, key, b64(DATA.blob));
  return new TextDecoder().decode(pt);
}
function show(html){
  // заменить документ расшифрованным отчётом
  document.open(); document.write(html); document.close();
}
async function unlock(html){ show(html); }

async function fromCache(){
  try{
    const raw = JSON.parse(localStorage.getItem(CK) || "null");
    if(!raw || Date.now() > raw.exp) return false;
    const key = await crypto.subtle.importKey("raw", b64(raw.k), {name:"AES-GCM"}, true, ["decrypt"]);
    const html = await tryDecrypt(key);        // подтверждает, что ключ верный
    unlock(html); return true;
  }catch(e){ localStorage.removeItem(CK); return false; }
}
document.getElementById("f").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const err = document.getElementById("err"); err.textContent = "";
  try{
    const key = await deriveKey(document.getElementById("pw").value);
    const html = await tryDecrypt(key);        // бросит, если пароль неверный (GCM-тег не сойдётся)
    const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
    localStorage.setItem(CK, JSON.stringify(
      {k: btoa(String.fromCharCode(...raw)), exp: Date.now() + CACHE_DAYS*864e5}));
    unlock(html);
  }catch(err2){ err.textContent = "Неверный пароль"; }
});
fromCache();
</script>
