<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Дашборд · вход</title>
<script>
try {
  const savedTheme=localStorage.getItem("theme");
  const dark=savedTheme==="dark" || (savedTheme!=="light" && matchMedia("(prefers-color-scheme:dark)").matches);
  document.documentElement.dataset.theme=dark ? "dark" : "light";
} catch (_) {}
</script>
<style>
  :root{color-scheme:light;--bg:#fdfefe;--surface:#ffffff;--text:#26373f;--text-2:#40535e;
    --line:#afc1c9;--accent:#1d7cb6;--on-accent:#ffffff;--bad:#e6230e}
  :root[data-theme="dark"]{color-scheme:dark;--bg:#000000;--surface:#020203;--text:#eef3f5;
    --text-2:#d2dfe5;--line:#697f8b}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
    font:1rem/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #gate{box-sizing:border-box;display:grid;min-height:100vh;min-height:100dvh;place-items:center;padding:16px}
  .card{box-sizing:border-box;width:min(100%,360px);padding:24px;text-align:center;background:var(--surface);
    border:1px solid var(--line);border-radius:18px}
  .lock{font-size:2rem;margin-bottom:8px}
  h1{font-size:1.25rem;font-weight:650;margin:0 0 4px}
  p{color:var(--text-2);font-size:.875rem;margin:0 0 20px}
  #pw{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;
    border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
  label{display:block;text-align:left;font-size:.875rem;margin:8px 0}
  .remember{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
  #remember{width:18px;height:18px;accent-color:var(--accent)}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;
    background:var(--accent);color:var(--on-accent);font:600 1rem/1.5 system-ui;cursor:pointer}
  button:active{transform:translateY(1px)}
  button:disabled{cursor:wait}
  .err{color:var(--text-2);font-size:.875rem;min-height:18px;margin-top:10px}
  .err[data-state="error"]{color:var(--text)}
</style></head>
<body>
<div id="gate"><div class="card">
  <div class="lock" aria-hidden="true">🔒</div>
  <h1>Приватный дашборд</h1>
  <p>Введите пароль, чтобы открыть данные</p>
  <form id="f" autocomplete="on">
    <label for="pw">Пароль</label>
    <input id="pw" type="password" inputmode="text" autocomplete="current-password"
           aria-describedby="err" required autofocus>
    <label class="remember"><input id="remember" type="checkbox"> Запомнить на этом устройстве на 30 дней</label>
    <button type="submit">Открыть</button>
    <div class="err" id="err" role="status" aria-atomic="true"></div>
  </form>
</div></div>

}
function watchLock(){
  addEventListener("storage", e => { if(e.key === LOCK || e.key === null) lock(false); });
  addEventListener("pageshow", e => { if(e.persisted && lockStamp() !== openedAt) lock(false); });
}
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(password){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password),
    "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(DATA.salt), iterations:DATA.iters, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function tryDecrypt(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(DATA.iv)}, key, b64(DATA.blob));
  return new TextDecoder().decode(pt);
}
async function show(html){
  // Cached WebCrypto can finish while the vault's inline script is still being parsed.
  // document.open() is then ignored, and document.write() appends the report to the gate:
  // the gate's global button/text CSS leaks into every dashboard screen. Wait until the
  // parser is finished and leave its current task before replacing the whole document.
  if(document.readyState === "loading"){
    await new Promise(resolve => document.addEventListener("DOMContentLoaded", resolve, {once:true}));
  }
  await new Promise(resolve => setTimeout(resolve, 0));
  if(lockStamp() !== openedAt){ location.reload(); return; }
  document.open(); document.write(html); document.close();
  const button = document.createElement("button");
  button.id = "dash-lock";
  button.type = "button";
  button.textContent = "Заблокировать";
  button.style.cssText = "min-height:44px;padding:0 10px;border:1px solid currentColor;border-radius:10px;background:transparent;color:inherit;font:inherit;font-size:13px;cursor:pointer";
  button.addEventListener("click", () => lock(true));
  const header = document.querySelector(".hero");
  if(header) header.append(button);
  else document.body.prepend(button);
  watchLock();
}
async function unlock(html){ await show(html); }

const form = document.getElementById("f");
const submit = form.querySelector("button[type=submit]");
const password = document.getElementById("pw");
const remember = document.getElementById("remember");
const status = document.getElementById("err");

function setOpening(active){
  submit.disabled = active;
  password.readOnly = active;
  remember.disabled = active;
  if(active){
    status.dataset.state = "busy";
    status.textContent = "Открываем отчёт…";
  }else if(status.dataset.state === "busy"){
    status.textContent = "";
    delete status.dataset.state;
  }
}
function showError(message){
  status.dataset.state = "error";
  status.textContent = message;
}
const openError = "Не удалось открыть отчёт. Попробуйте ещё раз.";

async function fromCache(){
  let raw;
  try{ raw = JSON.parse(localStorage.getItem(CK) || "null"); }
  catch{ forget(CK); return; }
  if(!raw) return;
  if(!Number.isFinite(raw.exp) || Date.now() >= raw.exp){ forget(CK); return; }
  setOpening(true);
  try{
    let html;
    try{
      const key = await crypto.subtle.importKey("raw", b64(raw.k), {name:"AES-GCM"}, false, ["decrypt"]);
      html = await tryDecrypt(key);
    }catch{ forget(CK); return; }
    await unlock(html);
  }catch{ showError(openError); }
  finally{ setOpening(false); }
}
form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  if(submit.disabled) return;
  setOpening(true);
  try{
    const key = await deriveKey(password.value);
    let html;
    try{ html = await tryDecrypt(key); }
    catch(error){
      showError(error.name === "OperationError"
        ? "Не удалось открыть отчёт. Проверьте пароль и попробуйте ещё раз."
        : openError);
      return;
    }
    if(remember.checked){
      if(lockStamp() !== openedAt){ location.reload(); return; }
      try {
        const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
        if(lockStamp() !== openedAt){ location.reload(); return; }
        localStorage.setItem(CK, JSON.stringify(
          {k: btoa(String.fromCharCode(...raw)), exp: Date.now() + CACHE_DAYS*864e5}));
      } catch {}  // The report can still open when browser storage is unavailable.
    }
    await unlock(html);
  }catch{ showError(openError); }
  finally{ setOpening(false); }
});
fromCache();
})();
</script>
